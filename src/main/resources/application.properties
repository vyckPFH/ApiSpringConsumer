spring.application.name=ApiSpringConsumer
server.port=8080

# Banco de Dados H2 em memória
spring.datasource.url=jdbc:h2:mem:rickmortydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console Web (acessível em /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Cache desligado para desenvolvimento
spring.thymeleaf.cache=false
